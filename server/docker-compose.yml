version: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.37.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up
        --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address postgres:localdb@postgres:5432/nakama
    volumes:
      - ./local.yml:/nakama/data/local.yml:ro
      - ./:/nakama/data/modules:ro
    ports:
      - "7349:7349"   # gRPC
      - "7350:7350"   # HTTP / WebSocket API
      - "7351:7351"   # Console
    restart: unless-stopped

volumes:
  pgdata:
