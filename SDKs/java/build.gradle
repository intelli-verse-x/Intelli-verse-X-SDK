plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'ai.intelli-verse-x'
version = '5.8.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    examples {
        java {
            srcDir 'examples'
        }
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('runExample', JavaExec) {
    group = 'application'
    description = 'Run BasicExample (requires local Nakama server)'
    dependsOn compileExamplesJava
    classpath = sourceSets.examples.output + sourceSets.examples.runtimeClasspath
    mainClass = 'com.intelliversex.sdk.examples.BasicExample'
}

repositories {
    mavenCentral()
    // Nakama Java client is published via JitPack (not Maven Central under com.heroiclabs.nakama-java)
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    // heroiclabs/nakama-java releases: https://github.com/heroiclabs/nakama-java/releases
    api 'com.github.heroiclabs:nakama-java:v2.5.3'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'sdk'
            version = project.version
            pom {
                packaging = 'jar'
                name = 'IntelliVerseX SDK'
                description = 'Complete modular game development SDK for Java/Android — Auth, Backend (Nakama), Profile, Wallet, Leaderboards, Storage, RPC.'
                url = 'https://github.com/Intelli-verse-X/Intelli-verse-X-Unity-SDK'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Intelli-verse-X/Intelli-verse-X-Unity-SDK.git'
                    developerConnection = 'scm:git:ssh://github.com/Intelli-verse-X/Intelli-verse-X-Unity-SDK.git'
                    url = 'https://github.com/Intelli-verse-X/Intelli-verse-X-Unity-SDK'
                }
                developers {
                    developer {
                        name = 'IntelliVerseX'
                        organization = 'Intelli-verse-X'
                        organizationUrl = 'https://github.com/Intelli-verse-X'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'centralPortal'
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = project.findProperty('ossrhStagingApiUsername') ?: System.getenv('OSSRH_STAGING_API_USERNAME') ?: ''
                password = project.findProperty('ossrhStagingApiPassword') ?: System.getenv('OSSRH_STAGING_API_PASSWORD') ?: ''
            }
        }
    }
}

signing {
    def keyId = project.findProperty('signing.keyId')?.toString()
    def secretKey = project.findProperty('signing.secretKeyRingFile')
    def password = project.findProperty('signing.password')?.toString()
    if (keyId && secretKey && password) {
        sign publishing.publications.maven
    } else if (project.hasProperty('signing.gnupg.keyName')) {
        useGpgCmd()
        sign publishing.publications.maven
    }
}
