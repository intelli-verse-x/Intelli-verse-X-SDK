name: C/C++ SDK

on:
  push:
    paths:
      - '.github/workflows/cpp-sdk.yml'
      - 'SDKs/cpp/**'
      - 'SDKs/cocos2dx/**'
  pull_request:
    paths:
      - '.github/workflows/cpp-sdk.yml'
      - 'SDKs/cpp/**'
      - 'SDKs/cocos2dx/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install curl
          fi

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install curl:x64-windows

      - name: Configure (C++ SDK, Unix)
        if: runner.os != 'Windows'
        working-directory: SDKs/cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DIVX_BUILD_TESTS=OFF

      - name: Configure (C++ SDK, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: SDKs/cpp
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -DIVX_BUILD_TESTS=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build (C++ SDK)
        working-directory: SDKs/cpp
        run: cmake --build build --config ${{ matrix.build-type }}

      - name: Configure (Cocos2d-x SDK)
        working-directory: SDKs/cocos2dx
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build (Cocos2d-x SDK)
        working-directory: SDKs/cocos2dx
        run: cmake --build build --config ${{ matrix.build-type }}
