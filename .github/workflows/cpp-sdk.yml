name: C/C++ SDK

on:
  push:
    paths:
      - 'SDKs/cpp/**'
      - 'SDKs/cocos2dx/**'
  pull_request:
    paths:
      - 'SDKs/cpp/**'
      - 'SDKs/cocos2dx/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      # nakama-cpp v2.8+ resolves deps via vcpkg (optional-lite, protobuf, …)
      - name: Install vcpkg dependencies (Nakama C++)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'b4f29c54450ddfc7efd2989cb9d32158ae291b40'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'SDKs/cpp/vcpkg.json'

      - name: Install system dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install curl
          fi

      - name: Configure (C++ SDK)
        working-directory: SDKs/cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DIVX_BUILD_TESTS=OFF

      - name: Build (C++ SDK)
        working-directory: SDKs/cpp
        run: cmake --build build --config ${{ matrix.build-type }}

      - name: Configure (Cocos2d-x SDK)
        working-directory: SDKs/cocos2dx
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build (Cocos2d-x SDK)
        working-directory: SDKs/cocos2dx
        run: cmake --build build --config ${{ matrix.build-type }}
