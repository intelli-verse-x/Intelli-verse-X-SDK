# Unity Tests CI — fail-closed when license secrets are missing.
# Package requires Unity 6000.3+ (Unity 6). Unity 2023 is not a supported target.

name: Unity Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'Packages/com.intelliversex.sdk/**'
      - 'Packages/com.intelliversex.sdk.*/**'
      - 'SDKs/unity/editor/**'
      - '.github/workflows/unity-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Packages/com.intelliversex.sdk/**'
      - 'Packages/com.intelliversex.sdk.*/**'
      - 'SDKs/unity/editor/**'
      - '.github/workflows/unity-tests.yml'
  workflow_dispatch:

env:
  PACKAGE_PATH: Packages/com.intelliversex.sdk
  UNITY_VERSION: 6000.3.6f1

jobs:
  validate-package:
    name: Validate Package Structure
    runs-on: ubuntu-latest
    outputs:
      package_valid: ${{ steps.validate.outputs.valid }}
      has_unity_license: ${{ steps.check-license.outputs.has_license }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Require Unity License (fail-closed)
        id: check-license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "has_license=true" >> $GITHUB_OUTPUT
            echo "Unity license secrets found"
          else
            echo "has_license=false" >> $GITHUB_OUTPUT
            echo "::error::UNITY_LICENSE or UNITY_SERIAL must be configured. Unity tests cannot be skipped on protected branches. See https://game.ci/docs/github/activation"
            exit 1
          fi

      - name: Validate package.json
        id: validate
        run: |
          PACKAGE_FILE="${{ env.PACKAGE_PATH }}/package.json"

          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found at $PACKAGE_FILE"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          python3 - <<'PY'
          import json, pathlib, os, sys
          path = pathlib.Path(os.environ["PACKAGE_PATH"]) / "package.json"
          data = json.loads(path.read_text(encoding="utf-8-sig"))
          name, version, unity = data.get("name"), data.get("version"), data.get("unity")
          print(f"Package: {name} v{version} (Unity {unity}+)")
          if name != "com.intelliversex.sdk" or not version or not unity:
              print("::error::Invalid package.json identity", file=sys.stderr)
              sys.exit(1)
          if not str(unity).startswith("6000"):
              print(f"::error::Expected Unity 6000.x floor, got {unity}", file=sys.stderr)
              sys.exit(1)
          if version != "6.0.0":
              print(f"::warning::package.json version is {version} (docs expect 6.0.0)")
          pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("valid=true\n")
          PY
          echo "Package validation passed"

  test-unity-6:
    name: Test Unity 6
    needs: validate-package
    if: needs.validate-package.outputs.package_valid == 'true' && needs.validate-package.outputs.has_unity_license == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: SDKs/unity/editor/Library
          key: Library-Test-6000-${{ hashFiles('Packages/com.intelliversex.sdk/**', 'SDKs/unity/editor/Packages/**', 'SDKs/unity/editor/ProjectSettings/**') }}
          restore-keys: |
            Library-Test-6000-

      - name: Run EditMode Tests (Unity 6)
        id: editmode-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: SDKs/unity/editor
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: artifacts/editmode
          customParameters: -nographics
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PlayMode Tests (Unity 6)
        id: playmode-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: SDKs/unity/editor
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          artifactsPath: artifacts/playmode
          customParameters: -nographics
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results-Unity6
          path: artifacts/

      - name: Fail if tests failed
        if: steps.editmode-tests.outcome == 'failure' || steps.playmode-tests.outcome == 'failure'
        run: exit 1

  build-validation:
    name: Build Validation
    needs: validate-package
    if: needs.validate-package.outputs.package_valid == 'true' && needs.validate-package.outputs.has_unity_license == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target-platform: [StandaloneWindows64, Android, WebGL]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: SDKs/unity/editor/Library
          key: Library-Build-6000-${{ matrix.target-platform }}-${{ hashFiles('Packages/com.intelliversex.sdk/**', 'SDKs/unity/editor/Packages/**') }}
          restore-keys: |
            Library-Build-6000-${{ matrix.target-platform }}-
            Library-Build-6000-

      - name: Build Validation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: SDKs/unity/editor
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.target-platform }}
          allowDirtyBuild: true

  test-summary:
    name: Test Summary
    needs: [validate-package, test-unity-6, build-validation]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary
        run: |
          echo "## Unity Test Results (v6 / Unity 6000)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package Validation | ${{ needs.validate-package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unity 6 Tests | ${{ needs.test-unity-6.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Validation | ${{ needs.build-validation.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.validate-package.result }}" != "success" ] || [ "${{ needs.test-unity-6.result }}" != "success" ]; then
            echo "::error::Required Unity checks did not pass (fail-closed)."
            exit 1
          fi
