name: Java SDK

on:
  push:
    paths:
      - 'SDKs/java/**'
  pull_request:
    paths:
      - 'SDKs/java/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [11, 17, 21]

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Windows checkouts can leave CRLF in gradlew; Linux CI needs LF + executable bit
      - name: Prepare Gradle wrapper (Linux)
        working-directory: SDKs/java
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build
        working-directory: SDKs/java
        run: ./gradlew clean build

      - name: Test
        working-directory: SDKs/java
        run: ./gradlew test
