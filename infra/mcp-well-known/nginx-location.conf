# Snippet for nginx server { } block — mcp.intelli-verse-x.ai
# Adjust alias path to where you copy .well-known/mcp/server-card.json from the repo.

# Public discovery document (no auth) — MUST be before any "deny all" or API auth
location = /.well-known/mcp/server-card.json {
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    # If serving from disk:
    alias /var/www/mcp-static/.well-known/mcp/server-card.json;
    # Optional: gzip_types application/json; (ensure clients accept gzip)
}

# Optional: OAuth protected resource metadata (only if RFC 9728 is fully wired)
# location = /.well-known/oauth-protected-resource { ... }
