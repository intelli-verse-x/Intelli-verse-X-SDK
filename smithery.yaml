name: intelliversex-game-sdk
description: >
  IntelliVerseX Game SDK MCP Server — 50+ tools for managing Nakama game backends,
  Hiro live-ops (economy, achievements, energy, streaks, store, challenges),
  Satori analytics (events, flags, experiments, live events), player management,
  and server administration.
icon: https://intelli-verse-x.github.io/Intelli-verse-X-SDK/assets/logo.svg
author:
  name: IntelliVerse-X
  url: https://intelli-verse-x.ai
repository: https://github.com/Intelli-verse-X/Intelli-verse-X-SDK
license: MIT
tags:
  - game-development
  - nakama
  - multiplayer
  - analytics
  - live-ops
  - economy
  - unity
  - unreal
  - godot
transport: streamable-http
url: https://mcp.intelli-verse-x.ai/api/mcp

# Smithery Connect: prompts users for secrets and forwards them to your upstream MCP URL.
# See https://smithery.ai/docs/build/session-config — max ~1KB, flat properties only.
# Matches CORS on the MCP host (X-API-Key).
configSchema:
  type: object
  description: Credentials for the hosted IntelliVerseX MCP server.
  properties:
    apiKey:
      type: string
      title: MCP API key
      description: API key for your IntelliVerseX backend; forwarded to the server as X-API-Key.
      x-from:
        header: x-api-key
      x-to:
        header: X-API-Key
  required:
    - apiKey

# Optional: shown as sample in Smithery UI / docs (not a real secret).
exampleConfig:
  apiKey: replace-with-your-mcp-api-key

tools:
  - nakama_health
  - nakama_auth
  - nakama_rpc
  - nakama_systems_status
  - nakama_build
  - nakama_restart
  - hiro_config_get
